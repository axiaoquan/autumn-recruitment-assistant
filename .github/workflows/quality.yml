name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check.mjs
      - name: Check Unix command wrapper
        if: runner.os != 'Windows'
        run: ./scripts/ledger help
      - name: Check Windows command wrapper
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\ledger.cmd help
